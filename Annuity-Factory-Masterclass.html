function drawBar(canvas, rows, key='p'){

const max=Math.max(...rows.map(r=>r[key]),1);
const pad=28, barH=Math.min(28,(h-pad*2)/rows.length-8);
rows.forEach((r,i)=>{
const y=pad+i*(barH+10);
const bw=((w-pad*2-100)/max)*r[key];
ctx.fillStyle='#2a3040';ctx.fillRect(pad+100,y,w-pad*2-100,barH);
ctx.fillStyle=r.c||'#5b8def';ctx.fillRect(pad+100,y,bw,barH);

ctx.fillStyle='#eef0f4';ctx.textAlign='right';
ctx.fillText(r[key]+'%',w-pad,y+barH*0.72);
});
}

function drawPuzzle(canvas){
const dpr=window.devicePixelRatio||1;
const w=canvas.clientWidth,h=canvas.clientHeight;
canvas.width=w*dpr;canvas.height=h*dpr;
const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
ctx.clearRect(0,0,w,h);
const cx=w/2,cy=h/2-6,R=Math.min(w,h)*0.32;
const parts=[{v:DATA.puzzle.actual,c:'#c9a227',l:'Buy ~13%'},{v:DATA.puzzle.willing-DATA.puzzle.actual,c:'#2a3040',l:'Gap'},{v:100-DATA.puzzle.willing,c:'#5b8def',l:'Willing pool rest'}];
// simpler donut: willing vs buy
const data=[{v:13,c:'#c9a227'},{v:37,c:'#5b8def'},{v:50,c:'#2a3040'}];
let a=-Math.PI/2;const sum=data.reduce((s,d)=>s+d.v,0);
data.forEach(d=>{
const ang=d.v/sum*Math.PI*2;
ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+ang);ctx.closePath();ctx.fillStyle=d.c;ctx.fill();
a+=ang;
});
ctx.beginPath();ctx.arc(cx,cy,R*0.55,0,Math.PI*2);ctx.fillStyle='#161a22';ctx.fill();
ctx.fillStyle='#eef0f4';ctx.font='600 18px system-ui';ctx.textAlign='center';
ctx.fillText('50% → 13%',cx,cy+6);
ctx.fillStyle='#9aa3b2';ctx.font='12px system-ui';
ctx.fillText('Willing  ·  Actual buy',cx,cy+26);
}
function drawGraph(svg, id){
const g=GRAPHS[id]; if(!g) return;
const tone={core:'#1c212c',metric:'#243556',action:'#163528',risk:'#3a3010',product:'#161a22'};
const stroke={core:'#5b8def',metric:'#5b8def',action:'#3d9a6a',risk:'#c9a227',product:'#3a4356'};
const by={}; g.nodes.forEach(n=>by[n.id]=n);
let edges='';
g.edges.forEach(([a,b])=>{
const A=by[a],B=by[b];
edges+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#3a4356" stroke-width="0.4"/>`;
});
let nodes='';
g.nodes.forEach(n=>{
nodes+=`<rect x="${n.x-9}" y="${n.y-3.2}" width="18" height="6.4" rx="1.4" fill="${tone[n.t]||tone.core}" stroke="${stroke[n.t]||'#5b8def'}" stroke-width="0.35"/><text x="${n.x}" y="${n.y+0.9}" text-anchor="middle" fill="#eef0f4" font-size="2.3" font-weight="600">${n.l}</text>`;
});
svg.innerHTML=edges+nodes;
}
function renderSlide(slide){
const stage=document.getElementById('pStage');
let html=`<div class="slide-eyebrow">${slide.e||''}</div><h2 class="slide-title">${slide.t}</h2>`;
if(slide.s) html+=`<p class="slide-sub">${slide.s}</p>`;
if(slide.b) html+=`<p class="slide-sub">${slide.b}</p>`;
if(slide.k==='stats'){
html+=`<div class="stats">${slide.stats.map(s=>`<div class="stat"><div class="l">${s.l}</div><div class="v">${s.v}</div>${s.h?`<div class="h">${s.h}</div>`:''}</div>`).join('')}</div>`;
}
if(slide.k==='bullets'||slide.k==='close'){
html+=`<ul class="bullets">${(slide.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`;
}
if(slide.k==='compare'){
html+=`<div class="compare"><div class="col bad"><h4>${slide.lt||'Left'}</h4><ul>${slide.left.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="col good"><h4>${slide.rt||'Right'}</h4><ul>${slide.right.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
}
if(slide.k==='script'){
html+=`<div class="script"><div class="lbl">Say this</div><div class="body">${slide.script}</div></div>`;
}
if(slide.k==='formula'){
html+=`<div class="formula">${slide.f}</div>`;
if(slide.items) html+=`<ul class="bullets">${slide.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
}
if(slide.k==='chart'){
html+=`<div class="chart-wrap"><canvas class="chart" id="cLive"></canvas></div>`;
}
if(slide.k==='graph'){
html+=`<svg class="graph-svg" id="gLive" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>`;
}
stage.innerHTML=html;
requestAnimationFrame(()=>{
const c=document.getElementById('cLive');
if(c){
if(slide.chart==='income') drawBar(c, DATA.income.map(x=>({t:x.t,p:x.p,c:x.c})));

if(slide.chart==='fia') drawGroup(c, DATA.fia);
}
const g=document.getElementById('gLive');
if(g) drawGraph(g, slide.graph);
});
}
let idx=0;
function show(i){
idx=Math.max(0,Math.min(SLIDES.length-1,i));
renderSlide(SLIDES[idx]);
document.getElementById('pCount').textContent=`${idx+1} / ${SLIDES.length}`;
document.getElementById('pBar').style.width=`${((idx+1)/SLIDES.length)*100}%`;
document.getElementById('pPrev').disabled=idx===0;
document.getElementById('pNext').disabled=idx===SLIDES.length-1;
}
function openPresent(start=0){
document.getElementById('present').classList.remove('hidden');
show(start);
}
function closePresent(){
document.getElementById('present').classList.add('hidden');
if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
document.getElementById('pPrev').onclick=()=>show(idx-1);
document.getElementById('pNext').onclick=()=>show(idx+1);
document.getElementById('pExit').onclick=closePresent;
document.getElementById('pFs').onclick=()=>{
if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
else document.exitFullscreen().catch(()=>{});
};
window.addEventListener('keydown',e=>{
if(document.getElementById('present').classList.contains('hidden')) return;
if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(idx+1)}
if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(idx-1)}
if(e.key==='f'||e.key==='F') document.getElementById('pFs').click();
if(e.key==='Escape') closePresent();
});
let tx=0;
window.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
window.addEventListener('touchend',e=>{
if(document.getElementById('present').classList.contains('hidden')) return;
const dx=e.changedTouches[0].clientX-tx;
if(Math.abs(dx)>50) show(idx+(dx<0?1:-1));
},{passive:true});
